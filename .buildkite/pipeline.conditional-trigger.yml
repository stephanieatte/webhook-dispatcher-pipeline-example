# =============================================================================
# DISPATCHER VARIANT: native `if` conditionals (no diffing at all)
# =============================================================================
# https://buildkite.com/docs/pipelines/configure/conditionals
#
# Unlike the other two dispatcher variants in this repo, this one doesn't
# inspect the file diff at all. It routes purely on build metadata that's
# already available for free on every build: branch name, commit message,
# tag, pull request status, etc.
#
# This is the right tool when your routing question is "which
# branch/environment is this build for", not "which files changed under
# which directory". Good fits:
#   - hotfix/* branches should only trigger a hotfix pipeline
#   - only trigger a release pipeline when the build has a tag
#   - let a commit message flag skip an expensive downstream pipeline
#
# It's also composable with the path-based variants: an earlier step can
# write flags via `buildkite-agent meta-data set`, and `if` conditions
# further down can read them with `build.meta_data.foo == "true"` — so
# path-based and metadata-based routing aren't mutually exclusive if you
# need both.
#
# `if` and `branches` are mutually exclusive on the same step — pick one.
# =============================================================================

steps:
  - label: ":rocket: Trigger service-a"
    trigger: "service-a"
    if: build.branch == "main" || build.branch =~ /^feature\/service-a-/
    build:
      branch: "${BUILDKITE_BRANCH}"
      commit: "${BUILDKITE_COMMIT}"
      message: "${BUILDKITE_MESSAGE}"

  - label: ":rocket: Trigger service-b"
    trigger: "service-b"
    if: build.branch == "main" || build.branch =~ /^feature\/service-b-/
    build:
      branch: "${BUILDKITE_BRANCH}"
      commit: "${BUILDKITE_COMMIT}"
      message: "${BUILDKITE_MESSAGE}"

  - label: ":rotating_light: Trigger hotfix-pipeline"
    trigger: "hotfix-pipeline"
    if: build.branch =~ /^hotfix\//

  - label: ":package: Trigger release-pipeline"
    trigger: "release-pipeline"
    if: build.tag != null

  - label: ":test_tube: Trigger smoke-tests"
    trigger: "smoke-tests"
    # Skip this one if the committer explicitly asked to, e.g.
    # "fix typo [skip smoke]"
    if: build.message !~ /\[skip smoke\]/i
