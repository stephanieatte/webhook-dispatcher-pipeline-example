# =============================================================================
# DISPATCHER VARIANT: monorepo-diff plugin (path-based routing)
# =============================================================================
# An alternative to the root pipeline.yml + scripts/generate-trigger-steps.py
# approach. Instead of a custom diff-and-route script, this uses the
# official plugin:
#   https://github.com/buildkite-plugins/monorepo-diff-buildkite-plugin
#
# The plugin diffs the changed files itself and triggers a downstream
# pipeline for each `watch` entry whose `path` matches something in the
# diff. This is the plugin-based equivalent of routes.yml — same idea
# (path prefix -> pipeline), expressed as plugin config instead of a
# script + YAML file.
#
# To use this as your actual dispatcher: this pipeline is the one you'd
# connect the GitHub webhook to instead of the root pipeline.yml (don't
# run both against the same webhook).
#
# Trade-off vs. the custom script:
#   + No script to write or maintain, config lives in one place
#   + `if` conditions are supported per watched path (see monorepo-diff's
#     README) for branch/tag/message-based filtering on top of path
#   - Less flexible if your routing logic isn't expressible as
#     "path prefix -> pipeline" (e.g. routing by PR label, by a manifest
#     file, by commit author) — that's when the custom script approach
#     earns its complexity.
#
# Notes on the `diff` command:
#   - `git diff --name-only HEAD~1` (the plugin's default) compares
#     against the immediately preceding commit, which works for simple
#     push-based branches but is usually wrong for pull request builds.
#   - For PR builds, point `diff` at the PR base branch instead, e.g.:
#       diff: "git diff --name-only origin/${BUILDKITE_PULL_REQUEST_BASE_BRANCH:-main}...HEAD"
#     Adjust to match how your GitHub source control settings check out PRs.
# =============================================================================

steps:
  - label: ":mag: Check changed files"
    plugins:
      - monorepo-diff#v1.11.0:
          diff: "git diff --name-only HEAD~1"
          watch:
            # A change under either of these paths triggers service-a.
            # (libs/shared-proto/ is a dependency both services build
            # against — see libs/shared-proto/README.md)
            - path:
                - "services/service-a/"
                - "libs/shared-proto/"
              config:
                trigger: "service-a"
                label: ":rocket: Trigger service-a"
                build:
                  branch: "${BUILDKITE_BRANCH}"
                  commit: "${BUILDKITE_COMMIT}"
                  message: "Triggered by changes affecting service-a"

            - path: "services/service-b/"
              config:
                trigger: "service-b"
                label: ":rocket: Trigger service-b"
                build:
                  branch: "${BUILDKITE_BRANCH}"
                  commit: "${BUILDKITE_COMMIT}"
                  message: "Triggered by changes affecting service-b"

            # Example of combining a path match with a native conditional:
            # only trigger release-pipeline for changes under services/
            # AND only on main. Requires monorepo-diff >= v1.0.0.
            - path: "services/"
              config:
                if: build.branch == "main"
                trigger: "release-pipeline"
                label: ":package: Trigger release-pipeline"
