# =============================================================================
# DISPATCHER VARIANT: monorepo-diff plugin (path-based routing)
# =============================================================================
# This uses the official plugin: https://github.com/buildkite-plugins/monorepo-diff-buildkite-plugin
#
# The plugin diffs the changed files itself and triggers a downstream
# pipeline for each `watch` entry whose `path` matches something in the
# diff. 
# =============================================================================

steps:
  - label: ":mag: Check changed files"
    plugins:
      - monorepo-diff#v1.11.1:
          diff: "git diff --name-only HEAD~1"
          watch:
            - path: "services/service-a/"
              config:
                trigger: "deploy"
                label: ":rocket: Trigger service-a"
                build:
                  branch: "${BUILDKITE_BRANCH}"
                  commit: "${BUILDKITE_COMMIT}"
                  message: "Triggered by changes affecting service-a"
