# =============================================================================
# ROUTING TABLE
# =============================================================================
# Maps changed file path prefixes to downstream Buildkite pipeline slugs.
# This is the file most teams will edit to adapt this example — you should
# rarely need to touch generate-trigger-steps.py itself.
#
# How matching works:
#   - For each route, if ANY changed file path starts with ANY of the
#     listed `paths` prefixes, that route's `pipeline` is triggered.
#   - A single push can match (and trigger) multiple routes.
#   - Order doesn't matter; all matching routes are collected first,
#     de-duplicated, and then triggered together.
#
# Add a new downstream pipeline: add a new list entry below with the
# path prefix(es) that should trigger it. No script changes required.
# =============================================================================

routes:
  - pipeline: "service-a"
    paths:
      - "services/service-a/"
      - "libs/shared-proto/"      # example: a shared dependency both services use

  - pipeline: "service-b"
    paths:
      - "services/service-b/"

# Pipelines in this list are triggered on every build that reaches the
# dispatcher, regardless of the diff. Use sparingly (e.g. a repo-wide lint
# or security-scan pipeline). Leave empty if you don't need this.
always_trigger: []

# Branch patterns (fnmatch-style, e.g. "release/*") that should always
# trigger every pipeline listed in `routes`, ignoring the diff entirely.
# Useful for release branches where you want a full rebuild regardless
# of which files technically changed.
full_rebuild_branches:
  - "main"
  - "release/*"
