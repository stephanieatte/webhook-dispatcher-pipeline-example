# =============================================================================
# DOWNSTREAM PIPELINE: service-b
# =============================================================================
# Same story as service-a's pipeline.yml — no webhook, only ever started
# via a `trigger` step from the dispatcher pipeline.
#
# This one reads the env the dispatcher forwarded (see
# scripts/generate-trigger-steps.py -> build.env) just to show that the
# downstream pipeline has access to context about why it was triggered.
# =============================================================================

steps:
  - label: ":mag: Show trigger context"
    command: |
      echo "Triggered from: ${DISPATCHED_FROM_BUILD:-unknown}"
      echo "pretend: build service-b"

  - wait

  - label: ":node: Test"
    command: "echo 'pretend: npm test --prefix services/service-b'"

  - label: ":rocket: Deploy (main only)"
    command: "echo 'pretend: deploy service-b'"
    branches: "main"
